name: Test

on:
  push:
    branches:
    - main
  pull_request:
permissions:
  contents: read
jobs:
  # FIXME(lufia): revert this
  #
  # Under testing it with -cover and -covermode=atomic option pair,
  # when SP register is written with an address,
  # the program jumps to the address written to SP immediately.
  #
  #test:
  #  uses: lufia/workflows/.github/workflows/go-test.yml@65fcecee196960dacd2ee5bd97a822d28e53411f # v0.7.1
  #  with:
  #    os-versions: '["ubuntu-24.04", "macos-15"]'
  test:
    strategy:
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        go:
        - stable
        - oldstable
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ matrix.go }}
    - run: go test
      shell: bash
