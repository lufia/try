name: Test

on:
  push:
    branches:
    - main
  pull_request:
permissions:
  contents: read
jobs:
  # FIXME(lufia): revert this
  #
  # Under testing it with -cover and -covermode=atomic option pair,
  # when SP register is written with an address,
  # the program jumps to the address written to SP immediately.
  #
  #test:
  #  uses: lufia/workflows/.github/workflows/go-test.yml@65fcecee196960dacd2ee5bd97a822d28e53411f # v0.7.1
  #  with:
  #    os-versions: '["ubuntu-24.04", "macos-15"]'
  test:
    strategy:
      matrix:
        go:
        - stable
        - oldstable
        arch:
        - amd64
        - arm64
        - 386
        include:
        - arch: amd64
          os: ubuntu-24.04
          flags: -race -covermode=atomic -coverprofile=cover.out
        - arch: 386
          os: ubuntu-24.04
          # -race is not supported on 386 so we should omit it.
          flags: -covermode=atomic -coverprofile=cover.out
        - arch: arm64
          os: macos-15
          flags: -race -covermode=atomic -coverprofile=cover.out
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
    - run: go test $TESTFLAGS ./...
      shell: bash
      env:
        GOARCH: ${{ matrix.arch }}
        TESTFLAGS: ${{ matrix.flags }}
